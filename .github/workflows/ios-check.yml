name: iOS Build Check
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=ios --project-name mr_trendy_mobile --org com.mrtrendy .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --debug --no-codesign
